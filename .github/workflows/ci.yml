name: LexDigitalHD Core CI

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-pipeline:
    name: Build & Validate Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (Requirement for EPUBCheck)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Full Test Suite (Jest + Axe-Core)
        run: npm run test:core:all
        env:
          CI: true

      - name: Execute EPUBCheck Validation
        run: npm run ci:epub