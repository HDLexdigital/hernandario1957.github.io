name: LexDigitalHD Core CI

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-pipeline:
    name: Build & Validate Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (Requirement for EPUBCheck)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Install PowerShell Core
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Run Architectural Auditor
        shell: pwsh
        run: |
          if (Test-Path "./tools/verificar_core.ps1") {
            ./tools/verificar_core.ps1
          } elseif (Test-Path "./verificar_core.ps1") {
            ./verificar_core.ps1
          } else {
            Write-Error "No se encontró verificar_core.ps1"
            exit 1
          }

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Official EPUBCheck
        run: |
          wget -q https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck-5.2.1.zip
          chmod +x epubcheck-5.2.1/epubcheck
          echo "${{ github.workspace }}/epubcheck-5.2.1" >> $GITHUB_PATH

      - name: Execute Full Test Suite (Jest + Axe-Core)
        run: npm run test:core:all
        env:
          CI: true

      - name: Build Web Publication
        run: npm run build:web

      - name: Execute EPUBCheck Validation
        run: npm run ci:epub