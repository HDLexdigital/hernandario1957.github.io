<h1 lang="es-CO">ESTATUTO TRIBUTARIO</h1>
<p lang="es-CO">ARTÍCULO 1o. ORIGEN DE LA OBLIGACIÓN SUSTANCIAL. La obligación tributaria sustancial se origina al realizarse el presupuesto o los presupuestos previstos en la ley como generadores del impuesto y ella tiene por objeto el pago del tributo.</p>
