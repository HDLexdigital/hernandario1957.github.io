<h1 lang="es-CO">CÓDIGO CIVIL COLOMBIANO</h1>
<p lang="es-CO">ARTÍCULO 1o. DISPOSICIÓN COMPRENDIDA. La ley civil comprende las disposiciones que versan sobre los derechos y obligaciones de los habitantes de la República, por razón de sus personas, de sus bienes y de sus relaciones de familia e intereses generales.</p>
